services:
  mysql:
    image: mysql:8
    container_name: db_agent_mysql
    ports:
      - "3306:3306"
    # Use mysql.env (not project .env) so Compose does not parse `$` in passwords at compose time.
    env_file:
      - mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  adminer:
    image: adminer:4
    container_name: db_agent_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
